[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-guard"
version = "0.1.0"
description = "Python SDK for AegisLLM"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0"
]
[project.optional-dependencies]
langchain = [
    "langchain>=1.0.0"
]
[tool.setuptools.packages.find]
include = ["aegis_guard*"]

